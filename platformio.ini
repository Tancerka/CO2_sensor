; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-stamps3]
platform_packages = tool-esptool.py@https://github.com/tasmota/esptool/releases/download/v4.7.0/esptool-4.7.0.zip
platform = espressif32
board = m5stack-stamps3
framework = arduino
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = 
	m5stack/M5Dial@^1.0.2
	boschsensortec/BME68x Sensor library@^1.2.40408
	m5stack/M5Unified@^0.2.2
	adafruit/Adafruit FRAM I2C@^2.0.3
	boschsensortec/bsec2@^1.8.2610
	bblanchon/ArduinoJson@^7.3.0
	esphome/ESPAsyncWebServer-esphome@^3.3.0
	arduino-libraries/NTPClient@^3.2.1
upload_speed = 115200
monitor_speed = 115200
monitor_port = COM3
upload_port = COM3
